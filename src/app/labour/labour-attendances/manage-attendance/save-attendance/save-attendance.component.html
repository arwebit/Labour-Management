<div class="bg-light rounded h-100 p-4">
  <h6 class="mb-4">
    Save attendance as on {{ workDate | date : "dd/MM/yyyy" }}
  </h6>
  <form [formGroup]="saveAttendanceForm">
    <input
      type="date"
      class="form-control"
      formControlName="work_date"
      [(ngModel)]="workDate"
      [value]="workDate"
      style="display: none"
    />
    <b class="text-danger">{{ workDateErr }} </b>
    <div class="mb-3">
      <label class="form-label"
        >Labour
        <b class="text-danger"> * {{ labourErr }}</b>
      </label>
      <select
        class="form-control"
        formControlName="labour"
        [(ngModel)]="labourID"
        (change)="getLabourDetails()"
      >
        <option value="">Select Labour</option>
        <option [value]="labours.user_id" *ngFor="let labours of labourLists">
          {{ labours.full_name }}
        </option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label"
        >Labour Rate
        <b class="text-danger"> * {{ labourRateErr }}</b>
      </label>
      <input
        [(ngModel)]="labourRate"
        type="text"
        class="form-control"
        placeholder="Enter labour Rate"
        formControlName="labour_rate"
      />
    </div>
    <div class="mb-3">
      <label class="form-label"
        >Work Site
        <b class="text-danger"> * {{ workSiteErr }}</b>
      </label>
      <select class="form-control" formControlName="work_site">
        <option value="">Select work site</option>
        <option
          [value]="workSite.work_site_id"
          *ngFor="let workSite of workSiteLists"
        >
          {{ workSite.work_site_name }}
        </option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label"
        >Check In Time
        <b class="text-danger"> * {{ checkInErr }}</b>
      </label>
      <input
        type="datetime-local"
        class="form-control"
        placeholder="Enter Check In Time"
        formControlName="check_in"
      />
    </div>

    <div class="mb-3">
      <label class="form-label"
        >Check In Location
        <b class="text-danger"> * {{ checkInLocationErr }}</b>
      </label>
      <textarea
        class="form-control"
        placeholder="Enter Check In Location"
        formControlName="check_in_location"
      ></textarea>
    </div>

    <button class="btn btn-primary" (click)="saveAttendance()">Save</button>
  </form>
</div>
<ion-toast
  [isOpen]="isToastOpen"
  [message]="saveMsg"
  [duration]="3000"
  (didDismiss)="setToastOpen(false)"
></ion-toast>
