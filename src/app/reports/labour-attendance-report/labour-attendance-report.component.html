<ion-content [fullscreen]="true">
  <div class="container-xxl position-relative bg-white d-flex p-0">
    <div class="content">
      <app-top></app-top>
      <div class="container-fluid pt-4 px-4">
        <div class="row g-4">
          <div class="col-sm-12 col-xl-6">
            <div class="card">
              <div class="card-body">
                <table style="padding: 5px" class="table">
                  <tr>
                    <td>
                      <small
                        >From Date <b> * {{ fromDateErr }} </b></small
                      >
                      <input
                        type="date"
                        [(ngModel)]="fromDate"
                        class="form-control"
                      />
                    </td>
                    <td>
                      <small
                        >To Date <b> * {{ toDateErr }} </b></small
                      >
                      <input
                        type="date"
                        [(ngModel)]="toDate"
                        class="form-control"
                      />
                    </td>
                  </tr>

                  <tr>
                    <td>
                      <small
                        >Start <b> * {{ startErr }} </b></small
                      >
                      <input
                        type="text"
                        [(ngModel)]="start"
                        class="form-control"
                      />
                    </td>
                    <td>
                      <small>Limit</small>
                      <input
                        type="text"
                        readonly
                        [(ngModel)]="limit"
                        class="form-control"
                      />
                    </td>
                  </tr>
                </table>
                <button
                  class="btn btn-primary"
                  style="margin-top: 5px"
                  (click)="getAttendanceList()"
                >
                  Apply
                </button>
                <hr />
                <div
                  class="table-responsive"
                  *ngIf="resultDiv"
                  style="font-size: 14px"
                >
                  <ion-fab
                    slot="fixed"
                    vertical="bottom"
                    horizontal="end"
                    class="print"
                    (click)="downloadPDF()"
                  >
                    <ion-fab-button size="small" color="primary">
                      <i class="fa-solid fa-print"></i>
                    </ion-fab-button>
                  </ion-fab>

                  <div id="pdfContent">
                    <div class="body_container">
                      <table class="table print-table">
                        <thead>
                          <tr class="header_color">
                            <td style="text-align: center">Marbelzz</td>
                          </tr>
                        </thead>
                        <tbody>
                          <tr>
                            <td>
                              <div
                                style="
                                  font-weight: bold;
                                  text-align: center;
                                  margin-bottom: 10px;
                                  text-decoration: underline;
                                "
                              >
                                Attendances between
                                {{ fromDate | date : "dd/MM/yyyy" }} to
                                {{ toDate | date : "dd/MM/yyyy" }}
                              </div>
                              <table
                                class="table"
                                style="
                                  width: 100%;
                                  border: 1px solid rgb(230, 220, 220);
                                "
                              >
                                <thead>
                                  <tr>
                                    <th>Labour Name</th>
                                    <th>Number of Wages</th>
                                  </tr>
                                </thead>
                                <tbody>
                                  <tr
                                    *ngFor="let attendances of attendanceList"
                                  >
                                    <td>
                                      {{ attendances.labour_name }}
                                    </td>
                                    <td>{{ attendances.no_of_attendances }}</td>
                                  </tr>
                                </tbody>
                              </table>
                            </td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</ion-content>
