<ion-content [fullscreen]="true">
  <ion-refresher
    slot="fixed"
    (ionRefresh)="doRefresh($event)"
    class="custom-refresher"
  >
    <ion-refresher-content
      pullingIcon="refresh-outline"
      refreshingSpinner="crescent"
    >
    </ion-refresher-content>
  </ion-refresher>
  <div class="container-xxl position-relative bg-white d-flex p-0">
    <div class="content">
      <app-top></app-top>
      <div class="container-fluid pt-4 px-4">
        <ion-fab
          slot="fixed"
          vertical="bottom"
          horizontal="end"
          class="view"
          (click)="toggleFormDiv('view')"
          *ngIf="hasAccess(env.view_work_site, userRole)"
        >
          <ion-fab-button size="small" color="primary">
            <i class="fa-solid fa-eye"></i>
          </ion-fab-button>
        </ion-fab>
        <a
          (click)="toggleFormDiv('create')"
          *ngIf="hasAccess(env.add_work_site, userRole)"
        >
          <ion-fab slot="fixed" vertical="bottom" horizontal="end" class="add">
            <ion-fab-button size="small" color="success">
              <i class="fa-solid fa-plus"></i>
            </ion-fab-button>
          </ion-fab>
        </a>

        <ion-fab slot="fixed" vertical="bottom" horizontal="end" class="sort">
          <ion-fab-button size="small" color="tertiary">
            <i class="fa-solid fa-arrow-up-wide-short"></i>
          </ion-fab-button>
          <ion-fab-list side="start">
            <ul class="sorting">
              <li (click)="sort('')">Remove sorting</li>
              <li (click)="sort('1')">Sort by Work Site Name (Desc)</li>
              <li (click)="sort('2')">Sort by Work Site Name (Asc)</li>
            </ul>
          </ion-fab-list>
        </ion-fab>

        <div class="row g-4">
          <div class="col-sm-12 col-md-12 col-xl-4">
            <div class="card">
              <div class="card-body">
                <div *ngIf="showLists">
                  <div
                    class="d-flex align-items-center border-bottom py-3"
                    *ngFor="let workSitesList of workSitesLists"
                    (click)="
                      hasAccess(env.edit_work_site, userRole)
                        ? toggleFormDiv('edit', workSitesList.work_site_id)
                        : denyAccess(
                            'Warning',
                            'You have no permission to access this module'
                          )
                    "
                  >
                    <div class="w-100 ms-3">
                      <div class="d-flex w-100 justify-content-between">
                        <h6 class="mb-0">{{ workSitesList.work_site_name }}</h6>
                        <small>Active: {{ workSitesList.is_active }}</small>
                      </div>
                      <small
                        >Location :
                        {{ workSitesList.work_site_location }}</small
                      >
                    </div>
                  </div>
                </div>
                <!-- Add Work Site -->

                <form [formGroup]="addWorkSiteForm" *ngIf="entryForm">
                  <div
                    style="
                      margin-bottom: 10px;
                      font-weight: bold;
                      text-decoration: underline;
                      text-align: center;
                    "
                  >
                    ADD WORK SITE
                  </div>
                  <div class="mb-3">
                    <label class="form-label"
                      >Work Site Name
                      <b class="text-danger">* {{ workSiteNameErr }}</b>
                    </label>
                    <input
                      type="text"
                      formControlName="work_site_name"
                      placeholder="Work Site Name"
                      class="form-control"
                      tabindex="1"
                    />
                  </div>
                  <div class="mb-3">
                    <label class="form-label"
                      >Work Location
                      <b class="text-danger">* {{ workSiteLocationErr }}</b>
                    </label>
                    <input
                      type="text"
                      formControlName="work_site_location"
                      placeholder="Work Site Location"
                      tabindex="2"
                      class="form-control"
                    />
                  </div>

                  <div class="mb-3">
                    <button
                      type="submit"
                      tabindex="3"
                      class="btn btn-primary"
                      (click)="addWorkSites()"
                    >
                      Create Work Site
                    </button>
                  </div>
                </form>
                <!-- Edit Work Site -->

                <form [formGroup]="editWorkSiteForm" *ngIf="editForm">
                  <div
                    style="
                      margin-bottom: 10px;
                      font-weight: bold;
                      text-decoration: underline;
                      text-align: center;
                    "
                  >
                    EDIT WORK SITE
                  </div>
                  <div class="mb-3">
                    <label class="form-label"
                      >Work Site Name
                      <b class="text-danger">* {{ workSiteNameErr }}</b>
                    </label>
                    <input
                      type="text"
                      formControlName="work_site_name"
                      placeholder="Work Site Name"
                      class="form-control"
                      tabindex="4"
                    />
                  </div>
                  <div class="mb-3">
                    <label class="form-label"
                      >Work Site Location
                      <b class="text-danger">* {{ workSiteLocationErr }}</b>
                    </label>
                    <input
                      type="text"
                      formControlName="work_site_location"
                      placeholder="Work Site Location"
                      tabindex="5"
                      class="form-control"
                    />
                  </div>
                  <div class="mb-3">
                    <label class="form-label"
                      >Active
                      <b class="text-danger">* {{ statusErr }}</b>
                    </label>
                    <select
                      formControlName="is_active"
                      class="form-control"
                      tabindex="6"
                    >
                      <option value="yes">Yes</option>
                      <option value="no">No</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <button
                      type="submit"
                      tabindex="7"
                      class="btn btn-primary"
                      (click)="updateWorkSites()"
                    >
                      Update Work Site
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <ion-toast
    [isOpen]="isToastOpen"
    [message]="saveMsg"
    [duration]="3000"
    (didDismiss)="setToastOpen(false)"
  ></ion-toast>
</ion-content>
