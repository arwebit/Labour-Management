<ion-content [fullscreen]="true">
  <div class="container-xxl position-relative bg-white d-flex p-0">
    <!-- Sign In Start -->
    <div class="container-fluid">
      <div
        class="row h-100 align-items-center justify-content-center"
        style="min-height: 100vh"
      >
        <div class="col-12 col-sm-8 col-md-6 col-lg-5 col-xl-4">
          <div class="bg-light rounded p-4 p-sm-5 my-4 mx-3">
            <div class="d-flex align-items-center justify-content-between mb-3">
              <a href="javascript:void(0)" class="">
                <h3 class="text-primary">
                  <i class="fa fa-hashtag me-2"></i>DASHMIN
                </h3>
              </a>
              <h3>Sign In</h3>
            </div>
            <form class="row g-3 needs-validation" [formGroup]="loginForm">
              <div class="form-floating mb-3">
                <input
                  type="text"
                  name="username"
                  class="form-control"
                  id="floatingInput"
                  formControlName="username"
                />
                <label for="floatingInput">Email address</label>
              </div>
              <div class="form-floating mb-4">
                <input
                  type="password"
                  name="password"
                  class="form-control"
                  id="floatingPassword"
                  formControlName="password"
                />
                <label for="floatingPassword">Password</label>
              </div>
              <button
                type="button"
                class="btn btn-primary py-3 w-100 mb-4"
                (click)="login()"
              >
                Sign In
              </button>

              <div
                class="spinner-border text-primary"
                *ngIf="isLoading"
                role="status"
              ></div>
              <div style="margin-top: 15px; color: red; font-weight: bold">
                {{ loginErr }}
              </div>
            </form>
            <div style="text-align: center; font-weight: bold; margin-top: 5px">
              Version : {{ version }}
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Sign In End -->
  </div>
</ion-content>
